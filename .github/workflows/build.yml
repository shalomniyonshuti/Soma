name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip if needed
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _src; done || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Find project
        run: |
          F=$(find _src . -name settings.gradle.kts 2>/dev/null | head -1)
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - run: gradle assembleDebug
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTranslate-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
