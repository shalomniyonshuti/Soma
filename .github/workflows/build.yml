name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o ScreenTranslator.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ScreenTranslator
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ScreenTranslator
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Could not|not found|Unresolved" build.log | sed 's/%/ /g' | head -10 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Rename APK
        run: cp ScreenTranslator/app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: ScreenTranslator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ScreenTranslator.apk
